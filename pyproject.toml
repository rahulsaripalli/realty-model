[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "realty-model"
version = "1.0.0"
description = "Investor-grade real estate financial model generator"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "numpy-financial>=1.0.0",
]

[project.scripts]
realty-model = "realty_model.cli:run"
